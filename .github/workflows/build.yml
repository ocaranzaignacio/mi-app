name: Compilar APK

on:
  push:
  workflow_dispatch:

env:
  PB_VERSION: '0.40.4'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Levantar un servidor PocketBase de prueba
        run: |
          curl -sSfL -o /tmp/pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          mkdir -p /tmp/pb && unzip -q /tmp/pb.zip -d /tmp/pb && cp -r servidor/pb_migrations /tmp/pb/
          /tmp/pb/pocketbase migrate up --dir /tmp/pb/pb_data --migrationsDir /tmp/pb/pb_migrations
          /tmp/pb/pocketbase superuser upsert admin@prueba.local AdminPrueba1234 --dir /tmp/pb/pb_data
          nohup /tmp/pb/pocketbase serve --http=127.0.0.1:8090 --dir /tmp/pb/pb_data --migrationsDir /tmp/pb/pb_migrations --publicDir servidor/pb_public > /tmp/pb/log.txt 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8090/ | grep -q 'Iniciar sesión' || { echo '::error::La versión web no responde'; exit 1; }
          ST=$(curl -sf -X POST http://127.0.0.1:8090/api/collections/_superusers/auth-with-password \
            -H 'Content-Type: application/json' -d '{"identity":"admin@prueba.local","password":"AdminPrueba1234"}' | jq -r .token)
          curl -sf -X POST http://127.0.0.1:8090/api/collections/users/records -H "Authorization: $ST" \
            -H 'Content-Type: application/json' \
            -d '{"email":"tecnico@prueba.local","password":"Tecnico1234","passwordConfirm":"Tecnico1234","verified":true,"name":"Prueba"}' > /dev/null

      - name: Probar la sincronización
        env:
          PB_URL: http://127.0.0.1:8090
          PB_USER: tecnico@prueba.local
          PB_PASS: Tecnico1234
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon 2>&1 | tee -a /tmp/gradle.log

      - name: Compilar APK de debug
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee -a /tmp/gradle.log

      - name: Mostrar errores de compilación o de pruebas
        if: failure()
        run: |
          if [ -f /tmp/gradle.log ]; then
            grep -E "^e: |FAILED|Exception|expected:|What went wrong" -A3 /tmp/gradle.log | head -60 | while IFS= read -r l; do
              echo "::error::${l//%/%25}"
            done
          fi
          [ -f /tmp/pb/log.txt ] && grep -E "ERROR|WARN" /tmp/pb/log.txt | tail -20 | while IFS= read -r l; do echo "::warning::PB ${l//%/%25}"; done || true

      - name: Armar el paquete del servidor para Windows
        run: |
          curl -sSfL -o /tmp/pbwin.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_windows_amd64.zip"
          mkdir -p dist/FicheroServidor
          unzip -q /tmp/pbwin.zip pocketbase.exe -d dist/FicheroServidor
          cp -r servidor/. dist/FicheroServidor/
          (cd dist && zip -qr ../FicheroServidor-Windows.zip FicheroServidor)

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: FicheroMotores-APK-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK y servidor en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version \
            app/build/outputs/apk/debug/FicheroMotores-debug.apk \
            FicheroServidor-Windows.zip \
            --title "Fichero de Motores (última versión)" \
            --notes "Compilado automáticamente del commit ${GITHUB_SHA::7}. FicheroMotores-debug.apk es la app para Android. FicheroServidor-Windows.zip es el servidor para la PC del taller (PocketBase ${PB_VERSION})." \
            --latest
