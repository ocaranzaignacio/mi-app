name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK de debug
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: FicheroMotores-APK-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          gh release create ultima-version app/build/outputs/apk/debug/FicheroMotores-debug.apk \
            --title "Fichero de Motores (última versión)" \
            --notes "APK de debug compilado automáticamente del commit ${GITHUB_SHA::7}. Descargá FicheroMotores-debug.apk e instalalo." \
            --latest
