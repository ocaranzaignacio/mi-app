<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fichero de Motores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: single-column workshop app; sticky bar, list of motor cards, detail with tabs, nameplate-style data plate. */
:root{
  --bg:#e9edf0; --panel:#ffffff; --panel-2:#f4f6f8; --ink:#16212b; --muted:#5b6874; --line:#cfd7de;
  --accent:#1c5aa0; --accent-ink:#ffffff; --accent-soft:#dde8f5;
  --plate:#d9dee3; --plate-ink:#1e2a33; --plate-line:#a9b3bc;
  --ok:#1f7a45; --ok-soft:#dcf0e3; --obs:#9a6200; --obs-soft:#fbeccd; --bad:#b3261e; --bad-soft:#f8dcd9;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171c; --panel:#1a2229; --panel-2:#212b33; --ink:#e3e9ee; --muted:#93a1ad; --line:#2f3b45;
  --accent:#6aa5ea; --accent-ink:#0b1a2b; --accent-soft:#1d3047;
  --plate:#2a333b; --plate-ink:#e1e7ec; --plate-line:#46535e;
  --ok:#6fcf97; --ok-soft:#173326; --obs:#e8b04b; --obs-soft:#3a2d12; --bad:#f08b83; --bad-soft:#3d1c1a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171c; --panel:#1a2229; --panel-2:#212b33; --ink:#e3e9ee; --muted:#93a1ad; --line:#2f3b45;
  --accent:#6aa5ea; --accent-ink:#0b1a2b; --accent-soft:#1d3047;
  --plate:#2a333b; --plate-ink:#e1e7ec; --plate-line:#46535e;
  --ok:#6fcf97; --ok-soft:#173326; --obs:#e8b04b; --obs-soft:#3a2d12; --bad:#f08b83; --bad-soft:#3d1c1a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:880px;margin:0 auto}
.top h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.top h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.04em;color:var(--muted);text-transform:none}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:var(--panel-2)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* list */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.alert b{color:var(--bad)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mcard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.mcard:hover{border-color:var(--accent)}
.mcard .code{font-family:var(--f-mono);font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.mcard .spec{grid-column:1/-1;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.mcard .badges{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.mcard .kind{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;align-self:center}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.obs{background:var(--obs-soft);color:var(--obs)}
.badge.mal{background:var(--bad-soft);color:var(--bad)}
.badge.info{background:var(--accent-soft);color:var(--accent)}
.badge.plain::before{display:none}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}
.empty h2{font-family:var(--f-display);font-size:22px;color:var(--ink);margin:0 0 6px;text-transform:uppercase;letter-spacing:.03em}
.empty p{margin:0 auto;max-width:42ch}

/* detail */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;margin-inline:-4px}
.tab{flex:none;border:0;background:transparent;padding:10px 12px;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:12px;margin-left:4px}
.headrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.headrow .spacer{flex:1}
.plate{background:var(--plate);color:var(--plate-ink);border-radius:6px;padding:14px;border:1px solid var(--plate-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.plate-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--plate-line);padding-bottom:8px;margin-bottom:8px}
.plate-h b{font-family:var(--f-display);font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.plate-h span{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere;text-align:right}
.plate-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:0;border-left:1px solid var(--plate-line);border-top:1px solid var(--plate-line)}
.plate-g div{border-right:1px solid var(--plate-line);border-bottom:1px solid var(--plate-line);padding:6px 8px;min-width:0}
.plate-g dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.75}
.plate-g dd{margin:0;font-family:var(--f-mono);font-weight:600;font-size:14px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sec h3{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 14px;margin:0}
.kv dt{font-size:12px;color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:14px;font-weight:600;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.none{color:var(--muted);font-size:14px;margin:0}
.flange{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.flange svg{width:100%;max-width:150px;height:auto}
@media (max-width:460px){.flange{grid-template-columns:1fr}.flange svg{max-width:130px;margin:0 auto}}
.rec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rec-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.rec-h .date{font-family:var(--f-mono);font-weight:600}
.rec-h .who{color:var(--muted);font-size:13px}
.rec-h .spacer{flex:1}
.rec p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.calc{display:flex;flex-direction:column;gap:6px}
.calc-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 10px;border-radius:7px;background:var(--panel-2)}
.calc-row .v{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums}
.calc-row .note{grid-column:1/-1;font-size:12px;color:var(--muted)}
.calc-row.ok{background:var(--ok-soft)} .calc-row.ok .v{color:var(--ok)}
.calc-row.obs{background:var(--obs-soft)} .calc-row.obs .v{color:var(--obs)}
.calc-row.mal{background:var(--bad-soft)} .calc-row.mal .v{color:var(--bad)}
.subh{font-family:var(--f-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.05em;margin:4px 0 0}
details.more summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
details.more[open] summary{margin-bottom:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.photo{position:relative;border-radius:8px;overflow:hidden;background:var(--panel-2);aspect-ratio:4/3;max-width:100%;border:0;padding:0;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover;display:block}

/* forms */
form{display:flex;flex-direction:column;gap:12px}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px 14px;margin:0;min-width:0}
legend{font-family:var(--f-display);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.05em;padding:0 6px;color:var(--accent)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld label{font-size:13px;color:var(--muted);font-weight:500}
.fld label .req{color:var(--bad)}
.inwrap{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);overflow:hidden}
.inwrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.inwrap input,.inwrap select,.inwrap textarea{flex:1;min-width:0;border:0;background:transparent;padding:9px 10px;outline:none;font-size:15px}
.inwrap textarea{min-height:84px;resize:vertical}
.inwrap .u{display:flex;align-items:center;padding:0 10px;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--panel);border-left:1px solid var(--line)}
input[type=search],.plain-in{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px 12px;outline:none;font-size:15px}
input[type=search]:focus{border-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--panel-2);cursor:pointer;font-size:14px}
.checks input{accent-color:var(--accent);width:17px;height:17px}
.live{border:1px dashed var(--accent);border-radius:8px;padding:10px;margin-top:10px}
.live:empty{display:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:8;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;padding:15px 20px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(10,30,60,.28);cursor:pointer}
.fab svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.4;fill:none;stroke-linecap:round}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(8,14,20,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--panel);border-radius:14px;padding:18px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.sheet p{margin:0;color:var(--muted)}
.viewer{position:fixed;inset:0;z-index:21;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.viewer img{max-height:80%;max-width:100%;object-fit:contain}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
.notice{background:var(--obs-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px;font-size:14px}
.muted{color:var(--muted)}
.login{max-width:380px;margin:40px auto 0;width:100%}
.login .sec{display:flex;flex-direction:column;gap:12px;padding:20px}
.login h2{font-family:var(--f-display);font-size:24px;text-transform:uppercase;letter-spacing:.03em;margin:0}
.err{color:var(--bad);font-size:14px;margin:0}
.nophoto{display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:8px;height:100%}
@media (min-width:900px){main,.top-in{max-width:1040px}.mlist{display:grid;grid-template-columns:1fr 1fr;gap:10px}}
.tiny{font-size:12px;color:var(--muted);margin:6px 0 0}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.aist{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.aist th,.aist td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.aist thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.aist tbody th{text-align:left;font-weight:600}
.aist td{font-family:var(--f-mono)}
.aist td.ix{font-weight:600;border-radius:4px}
.aist td.ok{color:var(--ok);background:var(--ok-soft)}.aist td.obs{color:var(--obs);background:var(--obs-soft)}.aist td.mal{color:var(--bad);background:var(--bad-soft)}
.aist.edit td{padding:4px 3px}
.aist.edit input{width:100%;min-width:58px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:7px 6px;text-align:right;font-family:var(--f-mono);font-size:14px;outline:none}
.aist.edit input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pills:empty{display:none}
.resbar{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}.resbar .spacer{flex:1}
.advpanel .grid{grid-template-columns:1fr 1fr}@media (min-width:640px){.advpanel .grid{grid-template-columns:repeat(4,1fr)}}
#advBtn span{font-family:var(--f-mono);font-size:12px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:11px 13px;cursor:pointer}
.opt:hover{border-color:var(--accent)}.opt b{font-weight:600}.opt span{font-size:13px;color:var(--muted)}
.sheet{max-height:calc(100% - 16px);overflow-y:auto}
@media (prefers-reduced-motion:no-preference){.mcard,.btn,.chip{transition:border-color .15s,background .15s}}
</style>

<header class="top"><div class="top-in">
  <button class="iconbtn" id="back" aria-label="Volver" hidden><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="ttl">Fichero de Motores<small id="sub">Registro técnico del taller</small></h1>
  <button class="iconbtn" id="refreshBtn" aria-label="Actualizar" title="Traer los últimos cambios" hidden><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
  <button class="iconbtn" id="exportBtn" aria-label="Exportar planilla" title="Exportar planilla CSV"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
  <button class="iconbtn" id="logoutBtn" aria-label="Cerrar sesión" title="Cerrar sesión" hidden><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l-5-5 5-5M5 12h11"/></svg></button>
</div></header>
<main id="app">
  <div class="empty"><h2>Cargando fichero…</h2><p>Conectando con el servidor del taller.</p></div>
</main>
<button class="fab" id="fab" hidden><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="fabTxt">Nuevo motor</span></button>
<div id="layer"></div>

<script>
/* ---------- esquemas ---------- */
const TIPOS={tri:'Trifásico inducción',mono:'Monofásico',cc:'Corriente continua',bomba:'Motobomba',motorred:'Motorreductor'};
const ESTADOS={serv:'En servicio',taller:'En taller',reserva:'Reserva',baja:'Baja'};
const o=a=>Object.fromEntries(a.map(x=>[x,x]));
const MOTOR=[
 {id:'ident',t:'Identificación',f:[
  ['codigo','Código / TAG','text',{req:1,ph:'MT-0142'}],
  ['tipo','Tipo de motor','select',{opts:TIPOS,req:1}],
  ['estado','Estado','select',{opts:ESTADOS}],
  ['cliente','Cliente / planta','text'],
  ['ubicacion','Ubicación','text',{ph:'Molienda, línea 2'}],
  ['equipo','Equipo accionado','text',{ph:'Bomba P-301'}]]},
 {id:'placa',t:'Datos de placa',f:[
  ['marca','Marca','text',{ph:'WEG'}],['modelo','Modelo','text'],['serie','Nº de serie','text'],
  ['anio','Año fabricación','num'],['pot','Potencia','num'],['potU','Unidad potencia','select',{opts:o(['kW','HP','CV'])}],
  ['tension','Tensión','text',{u:'V',ph:'380/660'}],['corriente','Corriente','text',{u:'A',ph:'28,5/16,4'}],
  ['frec','Frecuencia','select',{opts:o(['50','60']),u:'Hz'}],['rpm','Velocidad','num',{u:'rpm'}],
  ['polos','Número de polos','select',{opts:o(['2','4','6','8','10','12'])}],['fp','cos φ','num'],
  ['rend','Rendimiento','num',{u:'%'}],['ie','Clase eficiencia','select',{opts:o(['IE1','IE2','IE3','IE4','IE5'])}],
  ['fs','Factor servicio','num'],['carcasa','Carcasa (frame)','text',{ph:'160M'}],
  ['aisl','Clase aislación','select',{opts:o(['A','B','F','H'])}],['ip','Grado IP','text',{ph:'IP55'}],
  ['servicio','Servicio','text',{ph:'S1'}],['conexion','Conexión','select',{opts:o(['Δ','Y','Δ/Y','YY/Y','Dahlander','Serie/paralelo'])}],
  ['tamb','Temp. ambiente máx.','num',{u:'°C'}],['alt','Altitud máx.','num',{u:'m'}],
  ['peso','Peso','num',{u:'kg'}],['norma','Norma','text',{ph:'IEC 60034-1'}]]},

/* ---------- cálculos ---------- */
function calcPrueba(p,tipo){
  const out={};const add=(s,label,val,state,note)=>(out[s]=out[s]||[]).push({label,val,state,note});
  const ar=aisRows(p);
  const worst=(k)=>ar.filter(r=>r[k]!=null).reduce((a,b)=>!a||b[k]<a[k]?b:a,null);
  let w=worst('r1');if(w)add('ais','R 1 min más baja · '+w.pl,fmtR(w.r1)+' MΩ',w.r1<5?'mal':'ok','Referencia IEEE 43: mín. 5 MΩ bobinado aleatorio < 1 kV · 100 MΩ preformado');
  w=worst('dar');if(w)add('ais','DAR más bajo · '+w.pl,fx(w.dar),stDar(w.dar),'DAR = R 1 min / R 30 s · aceptable desde 1,25');
  w=worst('ip');if(w)add('ais','IP más bajo · '+w.pl,fx(w.ip),w.r1>5000?null:stIp(w.ip),'IP = R 10 min / R 1 min · IEEE 43: mínimo 2,0'+(w.r1>5000?' · con R 1 min > 5000 MΩ el IP no es indicativo':''));
  const lst=(ks)=>ks.map(k=>num(p[k])).filter(v=>v!=null);
  const unb=v=>{const a=v.reduce((x,y)=>x+y,0)/v.length;return{a,u:a?Math.max(...v.map(x=>Math.abs(x-a)))/a*100:0}};
  const kt=tk(tipo),tb=num(p.amb_t??p.bob_temp),r25=v=>v*259.5/(234.5+tb);
  if(kt!=='tri'){const ws=kt==='mono'?[['bob_uv','Bobina principal'],['bob_vw','Bobina auxiliar']]:[['bob_ind','Inducido'],['bob_campo','Campo']];
    if(tb!=null)ws.forEach(([key,l])=>{const v=num(p[key]);if(v!=null)add('bob','R '+l.toLowerCase()+' a 25 °C',fx(r25(v),4)+' Ω',null,'R25 = Rt × 259,5 / (234,5 + t) · t = temperatura ambiente')});
    if(kt==='mono'){const a=num(p.bob_uv),b=num(p.bob_vw);if(a!=null&&b!=null&&a>0)add('bob','Relación auxiliar / principal',fx(b/a),null,'Normalmente la bobina auxiliar tiene mayor resistencia que la principal')}}
  let rb=kt==='tri'?lst(['bob_u','bob_v','bob_w']):[];if(kt==='tri'&&rb.length<2)rb=lst(['bob_uv','bob_vw','bob_wu']);
  if(rb.length>=2){const{a,u}=unb(rb);add('bob','Desequilibrio entre fases',fx(u,1)+' %',u<=2?'ok':u<=5?'obs':'mal','Máx. desvío respecto al promedio · referencia ≤ 2 %');
    const tb=num(p.amb_t??p.bob_temp);if(tb!=null)add('bob','Promedio corregido a 25 °C (cobre)',fx(a*(234.5+25)/(234.5+tb),4)+' Ω',null,'R25 = Rt × 259,5 / (234,5 + t) · t = temperatura ambiente')}
  for(const[s,pre]of[['vac','vac'],['car','car']]){const iv=lst([pre+'_iu',pre+'_iv',pre+'_iw']);
    if(iv.length>=2){const{a,u}=unb(iv);add(s,'Corriente promedio',fx(a)+' A',null);add(s,'Desequilibrio de corriente',fx(u,1)+' %',u<=5?'ok':u<=10?'obs':'mal','Referencia ≤ 5 %')}
    const V=num(p[pre+'_v']),fp=kt==='cc'?1:num(p[pre+'_fp']);
    if(V!=null&&fp!=null&&iv.length){const ia=iv.reduce((x,y)=>x+y,0)/iv.length,w=(kt==='tri'?Math.sqrt(3):1)*V*ia*fp;
      add(s,'Potencia absorbida (calculada)',s==='car'?fx(w/1000,2)+' kW':fx(w,0)+' W',null,(kt==='tri'?'P = √3 × V × I prom × cos φ':kt==='mono'?'P = V × I × cos φ':'P = V × I')+(s==='vac'&&kt!=='cc'?' · en vacío usá el cos φ medido, no el de placa':''))}}
  const vv=lst(['vib_lah','vib_lav','vib_laa','vib_loah','vib_loav','vib_loaa']);
  if(vv.length){const L={I:[.71,1.8,4.5],II:[1.12,2.8,7.1],III:[1.8,4.5,11.2],IV:[2.8,7.1,18]}[p.vib_clase||'I'];const m=Math.max(...vv);
    const z=m<=L[0]?'A':m<=L[1]?'B':m<=L[2]?'C':'D';
    add('vib','Máximo medido · zona '+z,fx(m)+' mm/s',z==='D'?'mal':z==='C'?'obs':'ok',`Clase ${p.vib_clase||'I'}: A ≤ ${fx(L[0])} · B ≤ ${fx(L[1])} · C ≤ ${fx(L[2])} mm/s`)}
  const ta=num(ambT(p)),tc=num(p.tem_carc),tr=lst(['tem_la','tem_loa']);
  if(tr.length){const m=Math.max(...tr);add('tem','Rodamiento más caliente',fx(m,1)+' °C',m<=80?'ok':m<=95?'obs':'mal','Referencia: ≤ 80 °C normal, > 95 °C revisar')}
  if(ta!=null&&tc!=null)add('tem','Elevación de carcasa',fx(tc-ta,1)+' K',null);
  return out;
}

  return{q,pl,r30,r1,r10,dar:r1!=null&&r30>0?r1/r30:null,ip:r10!=null&&r1>0?r10/r1:null}}).filter(r=>all||r.r30!=null||r.r1!=null||r.r10!=null)}

async function pb(method,path,body,isForm){
  const h={};if(API.token)h.Authorization=API.token;let b=body;
  if(body&&!isForm){h['Content-Type']='application/json';b=JSON.stringify(body)}
  let r;try{r=await fetch(path,{method,headers:h,body:b})}catch(e){throw{code:0,message:'No se pudo conectar con el servidor. Revisá que la PC del taller esté encendida.'}}
  const t=await r.text();let j={};try{j=t?JSON.parse(t):{}}catch{}
  if(!r.ok)throw{code:r.status,message:j.message||('Error del servidor ('+r.status+')'),data:j.data};
  return j;
}

/* Trae todo lo que cambió desde la última vez y rearma motores y registros. */
async function cargar(){
  let page=1;
  while(true){
    const p={page,perPage:500,sort:'updated,id',skipTotal:1};if(S.cursor)p.filter=`updated >= ${q(S.cursor)}`;
    const r=await pb('GET','/api/collections/items/records?'+qs(p));
    for(const it of r.items){S.items[it.uid]=it;if(!S.cursor||it.updated>S.cursor)S.cursor=it.updated}
    if(r.items.length<500)break;page++;
  }
  const fr=await pb('GET','/api/collections/fotos/records?'+qs({perPage:500,skipTotal:1,sort:'-created'}));
  for(const f of fr.items)S.fotosRec[f.nombre]=f;
  rearmar();S.loaded=true;
}
function rearmar(){
  const motors=[],regs=[];
  for(const it of Object.values(S.items)){
    if(it.borrado||!it.datos)continue;
    if(it.tipo==='motor'){const m=it.datos;motors.push({id:it.uid,d:m.d||{},fotos:m.fotos||[],creado:m.creado,act:m.act})}
    else regs.push({...it.datos,id:it.uid});
  }
  for(const m of motors){
    const mine=regs.filter(r=>r.motorId===m.id);
    const lp=mine.filter(r=>r.kind==='prueba').sort((a,b)=>(b.v?.fecha||'').localeCompare(a.v?.fecha||''))[0];
    const lm=mine.filter(r=>r.kind==='mant').sort((a,b)=>(b.v?.fecha||'').localeCompare(a.v?.fecha||''))[0];
    m.resumen={ultPrueba:lp?{fecha:lp.v.fecha,resultado:lp.v.resultado||''}:null,ultMant:lm?{fecha:lm.v.fecha,tipo:lm.v.tipo}:null,proxMant:lm?.v?.proxima||null};
  }
  S.motors=motors;S.regs=regs;derivar();
}
/* Pruebas y mantenimientos del motor abierto, con la forma que usan las pantallas. */
function derivar(){
  const of=k=>S.regs.filter(r=>r.motorId===S.motorId&&r.kind===k).map(r=>({...r.v,id:r.id,secciones:r.secciones||[],por:r.tecnico||'',_r:r}))
    .sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  S.pruebas=of('prueba');S.mants=of('mant');
}
/* Guarda un motor o registro. No pisa una versión más nueva de otro técnico. */
async function putItem(uid,tipo,motorUid,datos,actualizado,borrado=false){
  const r=await pb('GET','/api/collections/items/records?'+qs({perPage:1,skipTotal:1,filter:`uid = ${q(uid)}`}));
  const cur=r.items[0],known=S.items[uid];
  if(cur&&(cur.actualizado>actualizado||(known&&cur.actualizado>known.actualizado))){
    await cargar();throw{message:'Otro técnico modificó este registro hace un momento. Se trajeron los cambios: revisalo y volvé a guardar.'}
  }
  const body={uid,tipo,motor_uid:motorUid||'',datos:datos??null,actualizado,borrado};
  const rec=cur?await pb('PATCH','/api/collections/items/records/'+cur.id,body):await pb('POST','/api/collections/items/records',body);
  S.items[uid]=rec;rearmar();
}
async function guardarMotor(m){const act=new Date().toISOString();const datos={id:m.id,d:m.d,fotos:m.fotos||[],creado:m.creado||act,act};
  await putItem(m.id,'motor',null,datos,stampOf(act))}
async function borrar(uid,tipo,motorUid){await putItem(uid,tipo,motorUid,null,Date.now(),true)}

/* ---------- filtros ---------- */
const ADV_DEF={potMin:'',potMax:'',polos:'',tipo:'',estado:'',marca:'',carcasa:'',tension:'',rod:'',lugar:'',brida:'',prueba:'',mant:''};
S.adv={...ADV_DEF};S.showAdv=false;
const potKW=d=>{const p=num(d.pot);if(p==null)return null;return p*(d.potU==='HP'?0.7457:d.potU==='CV'?0.7355:1)};
const has=(v,q)=>String(v||'').toLowerCase().includes(q.toLowerCase());
function matches(m){
  const d=m.d||{},a=S.adv,r=m.resumen||{};
  const k=potKW(d),mn=num(a.potMin),mx=num(a.potMax);
  if(mn!=null&&(k==null||k<mn-1e-6))return false;
  if(mx!=null&&(k==null||k>mx+1e-6))return false;
  if(a.polos&&d.polos!==a.polos)return false;
  if(a.tipo&&d.tipo!==a.tipo)return false;
  if(a.estado&&d.estado!==a.estado)return false;
  if(a.marca&&!has(d.marca,a.marca))return false;
  if(a.carcasa&&!has(d.carcasa,a.carcasa))return false;
  if(a.tension&&!has(d.tension,a.tension))return false;
  if(a.rod&&!(has(d.rodLA,a.rod)||has(d.rodLOA,a.rod)))return false;
  if(a.lugar&&!(has(d.cliente,a.lugar)||has(d.ubicacion,a.lugar)||has(d.equipo,a.lugar)))return false;
  if(a.brida&&d.brida!==a.brida)return false;
  if(a.prueba){if(a.prueba==='none'){if(r.ultPrueba)return false}else if(r.ultPrueba?.resultado!==a.prueba)return false}
  if(a.mant){const x=daysTo(r.proxMant);
    if(a.mant==='venc'&&!(x!=null&&x<0))return false;
    if(a.mant==='30'&&!(x!=null&&x>=0&&x<=30))return false;
    if(a.mant==='none'&&r.proxMant)return false}
  const q=S.q.trim().toLowerCase();
  if(q&&![d.codigo,d.marca,d.modelo,d.serie,d.cliente,d.ubicacion,d.equipo,d.rodLA,d.rodLOA,d.carcasa].join(' ').toLowerCase().includes(q))return false;
  return true;
}
function filtered(){return S.motors.filter(matches).sort((a,b)=>(a.d?.codigo||'').localeCompare(b.d?.codigo||'','es',{numeric:true}))}
const ADV_LABEL={potMin:'Potencia ≥',potMax:'Potencia ≤',polos:'Polos',tipo:'Tipo',estado:'Estado',marca:'Marca',carcasa:'Carcasa',tension:'Tensión',rod:'Rodamiento',lugar:'Cliente/ubicación',brida:'Brida',prueba:'Última prueba',mant:'Mantenimiento'};

     ${up?`<span class="badge ${RES_CLS[up.resultado]||''}">Prueba ${fdate(up.fecha)}: ${esc(up.resultado||'—')}</span>`:''}${mantBadge(m)}</span></button>`}).join('');

function fieldVal(f,d){const[k,,type,op={}]=f;let v=d[k];if(v==null||v==='')return null;
  if(type==='select'&&op.opts)v=op.opts[v]??v;if(type==='date')v=fdate(v);
  if(k==='pot')return `${v} ${d.potU||'kW'}`;if(k==='potU')return null;
  return op.u?`${v} ${op.u}`:v}
function kvHTML(fields,d){const items=fields.map(f=>[f[1],fieldVal(f,d),f[2]]).filter(x=>x[1]!=null);
  const short=items.filter(x=>x[2]!=='area'),long=items.filter(x=>x[2]==='area');
  return (short.length?`<dl class="kv">${short.map(([l,v])=>`<div><dt>${esc(l)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`:'')+
   long.map(([l,v])=>`<div style="margin-top:10px"><div class="muted" style="font-size:12px">${esc(l)}</div><p style="margin:2px 0 0;white-space:pre-wrap">${esc(v)}</p></div>`).join('')}
function secHTML(sec,d){const body=kvHTML(sec.f,d);return `<section class="sec"><h3>${esc(sec.t)}</h3>${body||'<p class="none">Sin datos cargados.</p>'}</section>`}

     ${extra.map(s=>secHTML(s,d)).join('')}${secHTML(sec('ident'),d)}${d.notas?secHTML(sec('notas'),d):''}`;

     ${secHTML(sec('eje'),d)}${secHTML(sec('aj'),d)}`;
  }

function inputHTML(f,d,prefix=''){
  const[k,l,type,op={}]=f;const v=d[k]??(type==='date'&&op.req?today():'');const id='f_'+prefix+k;
  let ctl;
  if(type==='select')ctl=`<select id="${id}" name="${k}" ${op.req?'required':''}><option value="">—</option>${Object.entries(op.opts).map(([ov,ol])=>`<option value="${esc(ov)}" ${String(v)===ov?'selected':''}>${esc(ol)}</option>`).join('')}</select>`;
  else if(type==='area')ctl=`<textarea id="${id}" name="${k}" placeholder="${esc(op.ph||'')}" ${op.req?'required':''}>${esc(v)}</textarea>`;
  else ctl=`<input id="${id}" name="${k}" ${type==='date'?'type="date"':type==='num'?'type="text" inputmode="decimal"':'type="text"'} value="${esc(v)}" placeholder="${esc(op.ph||'')}" ${op.req?'required':''} autocomplete="off">`;
  return `<div class="fld ${op.wide||type==='area'?'wide':''}"><label for="${id}">${esc(l)}${op.req?' <span class="req">*</span>':''}</label><div class="inwrap">${ctl}${op.u&&type!=='select'?`<span class="u">${esc(op.u)}</span>`:''}</div></div>`;
}
function readForm(form){const d={};form.querySelectorAll('[name]').forEach(el=>{if(el.type==='checkbox')return;const v=el.value.trim();if(v!=='')d[el.name]=v});return d}
function formShell(inner,saveTxt){return `<form id="frm" novalidate>${inner}<div class="actions"><button type="button" class="btn" id="cancel">Cancelar</button><button type="submit" class="btn primary" id="save">${saveTxt}</button></div></form>`}
function validate(form){const bad=[...form.querySelectorAll('[required]')].find(el=>!el.value.trim());if(bad){bad.focus();toast('Completá: '+bad.closest('.fld').querySelector('label').textContent.replace('*','').trim());return false}return true}

/* ---------- fotos ---------- */
async function shrink(file){
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.82));}catch{return file}
}
async function uploadPhoto(m,file){
  toast('Subiendo foto…');
  try{const blob=await shrink(file);const nombre=newId()+'.jpg';
    const fd=new FormData();fd.append('nombre',nombre);fd.append('motor_uid',m.id);fd.append('archivo',blob,nombre);
    const rec=await pb('POST','/api/collections/fotos/records',fd,true);S.fotosRec[nombre]=rec;
    const cur=S.motors.find(x=>x.id===m.id);
    await guardarMotor({...cur,fotos:[...(cur.fotos||[]),{file:nombre,nombre:'Foto',fecha:today()}]});
    await fileToken().catch(()=>{});render();toast('Foto agregada')}
  catch(e){toast(e?.message?('No se pudo subir la foto: '+e.message):'No se pudo subir la foto.')}
}
function viewPhoto(m,i){const f=(m.fotos||[])[i];if(!f)return;const u=fotoURL(f.file);
  $('#layer').innerHTML=`<div class="viewer">${u?`<img src="${esc(u)}" alt="${esc(f.nombre||'Foto')}">`:'<p style="color:#fff">Esta foto todavía no se subió desde el celular.</p>'}<div class="actions">${S.canWrite?`<button class="btn danger" id="phDel">Quitar foto</button>`:''}<button class="btn primary" id="phClose">Cerrar</button></div></div>`;
  $('#phClose').onclick=()=>$('#layer').innerHTML='';
  $('#phDel')&&($('#phDel').onclick=async()=>{const cur=S.motors.find(x=>x.id===m.id);
    try{await guardarMotor({...cur,fotos:(cur.fotos||[]).filter(x=>x.file!==f.file)});$('#layer').innerHTML='';render();toast('Foto quitada')}catch(e){toast(saveErr(e))}});
}

const csvCell=v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const csv=rows=>'﻿'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
async function save(filename,data){
  const url=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Descargado: '+filename);
}

const optVal=(f,d)=>{const[k,,t,op={}]=f;const v=d[k];return t==='select'&&op.opts&&v?(op.opts[v]??v):v};
function exportList(mode){
  const list=filtered();
  const head=[['LISTADO DE MOTORES',`Generado ${fdate(today())}`],['Filtros',[...activeAdv().map(([k,v])=>advText(k,v)),S.q.trim()&&`Búsqueda: ${S.q.trim()}`].filter(Boolean).join(' · ')||'Ninguno'],[]];
  let rows;
  if(mode==='resumen'){
    const F=allFields(MOTOR),g=k=>F.find(f=>f[0]===k);
    const cols=['codigo','tipo','estado','marca','modelo','serie','pot','potU','tension','corriente','rpm','polos','carcasa','rodLA','rodLOA','forma','brida','cliente','ubicacion','equipo'];
    rows=[[...cols.map(k=>g(k)[1]),'Potencia (kW)','Última prueba','Resultado','Próximo mantenimiento']];
    for(const m of list){const d=m.d||{},r=m.resumen||{},k=potKW(d);
      rows.push([...cols.map(c=>optVal(g(c),d)),k!=null?fx(k,2):'',fdate(r.ultPrueba?.fecha),r.ultPrueba?.resultado,fdate(r.proxMant)])}
  }else{
    const fs=allFields(MOTOR);
    rows=[[...fs.map(f=>f[1]+(f[3]?.u?` (${f[3].u})`:'')),'Potencia (kW)','Última prueba','Resultado','Último mantenimiento','Próximo mantenimiento']];
    for(const m of list){const d=m.d||{},r=m.resumen||{},k=potKW(d);
      rows.push([...fs.map(f=>optVal(f,d)),k!=null?fx(k,2):'',fdate(r.ultPrueba?.fecha),r.ultPrueba?.resultado,fdate(r.ultMant?.fecha),fdate(r.proxMant)])}
  }
  save(`motores-${mode}-${today()}.csv`,csv([...head,...rows]));
}
function exportMotor(mode='todo'){
  const m=S.motors.find(x=>x.id===S.motorId);if(!m)return;const d=m.d||{};
  const rows=[['FICHA DE MOTOR',d.codigo||''],['Generado',fdate(today())]];
  if(mode!=='hist')for(const s of MOTOR){if(s.when&&!s.when(d))continue;const items=s.f.map(f=>[f[1],fieldVal(f,d)]).filter(x=>x[1]!=null);if(!items.length)continue;rows.push([],[s.t.toUpperCase()],...items)}
  if(mode==='hist')rows.push(['Motor',motorSpec(d)]);
  if(mode!=='tec'){
    if(S.pruebas.length){rows.push([],['PRUEBAS']);for(const p of S.pruebas){const c=calcPrueba(p,d.tipo);rows.push([],['Fecha',fdate(p.fecha),'Motivo',p.motivo||'','Resultado',p.resultado||'','Técnico',who(p.por)]);
      if(ambT(p)!=null||p.amb_h!=null){rows.push(['Condiciones ambientales']);if(ambT(p)!=null)rows.push(['','Temperatura ambiente',ambT(p)+' °C']);if(p.amb_h!=null)rows.push(['','Humedad ambiente',p.amb_h+' % HR'])}
      for(const s of PRUEBA){if(!(p.secciones||[]).includes(s.id))continue;rows.push([s.t]);
        if(s.id==='ais'){if(p.ais_v)rows.push(['','Tensión de prueba',p.ais_v+' V']);rows.push(['','Medición','30 s (MΩ)','1 min (MΩ)','10 min (MΩ)','DAR','IP']);
          aisRows(p).forEach(r=>rows.push(['',r.pl,r.r30!=null?fmtR(r.r30):'',r.r1!=null?fmtR(r.r1):'',r.r10!=null?fmtR(r.r10):'',r.dar!=null?fx(r.dar):'',r.ip!=null?fx(r.ip):'']));
          (c.ais||[]).forEach(r=>rows.push(['',r.label,r.val]));continue}
        fieldsFor(s,d.tipo).forEach(f=>{const v=fieldVal(f,p);if(v!=null)rows.push(['',f[1],v])});(c[s.id]||[]).forEach(r=>rows.push(['',r.label,r.val]))}
      if(p.instrumento)rows.push(['Instrumentos',p.instrumento]);if(p.obs)rows.push(['Observaciones',p.obs])}}
    if(S.mants.length){rows.push([],['MANTENIMIENTOS'],['Fecha','Tipo','OT','Trabajo','Repuestos','Horas','Horómetro','Estado final','Próximo','Técnico']);
      for(const x of S.mants)rows.push([fdate(x.fecha),x.tipo,x.ot,x.descripcion,x.repuestos,x.horas,x.horometro,x.estadoFinal,fdate(x.proxima),who(x.por)])}
  }
  const suf={todo:'ficha',tec:'datos',hist:'historial'}[mode];
  save(`motor-${(d.codigo||'motor').replace(/[^\w.-]+/g,'_')}-${suf}-${today()}.csv`,csv(rows));
}
